# ===================================================
# Vua Tiếng Nhật AI - Spring Boot Application Config
# ===================================================

# Server Port (Duplicate Node.js port 5000 for zero-config React compatibility)
server.port=5000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/japanese_master_db?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Web Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================
# Security & JWT Configuration
# ===================================================
app.jwt.secret=${JWT_SECRET:vuaTiengNhatSuperSecretKeyForJwtAuthenticationAndRoleAuthorization2026SecureKey!}
app.jwt.expiration-ms=86400000
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:admin123}
app.admin.default-email=admin@vuatiengnhat.com
